<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>利润看板 · 只读</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1c2333;--ink2:#4a5268;--ink3:#8a92a8;--blue:#3b6cf6;--blue-soft:#eef2ff;
  --green:#0f8f63;--red:#d5443c;--line:#e6e9f2;--card:#fff}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:#f4f6fb;color:var(--ink);min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:17px;display:flex;align-items:center;gap:8px}
h1 .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.sub{font-size:12px;color:var(--ink3);margin:4px 0 14px}
.lock{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 18px;text-align:center}
.lock p{font-size:13px;color:var(--ink2);margin-bottom:14px}
.lock input{width:100%;max-width:280px;height:44px;padding:0 14px;border:1px solid var(--line);
  border-radius:10px;font-size:16px;outline:none;text-align:center;letter-spacing:2px}
.lock button{margin-top:12px;width:100%;max-width:280px;height:44px;border:0;border-radius:10px;
  background:var(--blue);color:#fff;font-size:15px;font-weight:600}
.lock .err{color:var(--red);font-size:12px;margin-top:10px;min-height:16px}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tabs{display:flex;background:#e8ecf6;border-radius:9px;padding:3px}
.tabs button{border:0;background:transparent;padding:7px 16px;border-radius:7px;font-size:13px;color:var(--ink2)}
.tabs button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(20,30,60,.08)}
select{height:36px;border:1px solid var(--line);border-radius:9px;padding:0 8px;font-size:13px;background:var(--card);outline:none}
.cur{margin-left:auto;display:flex;background:#e8ecf6;border-radius:9px;padding:3px}
.cur button{border:0;background:transparent;padding:5px 12px;border-radius:7px;font-size:12.5px;color:var(--ink2)}
.cur button.on{background:var(--card);color:var(--ink);font-weight:600}
.state{font-size:12px;color:var(--ink2);margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.state .ok{color:var(--green);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px}
.card .k{font-size:12px;color:var(--ink3);margin-bottom:5px}
.card .v{font-size:20px;font-weight:700}
.card .v small{font-size:12px;font-weight:400;color:var(--ink3);margin-left:2px}
.card.hl{background:var(--blue-soft);border-color:#d8e1ff}
.card.hl .v{color:var(--blue)}
.shops{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
.shops .hd{padding:12px 16px;font-size:13.5px;font-weight:700;border-bottom:1px solid var(--line)}
.shop{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #f0f2f8}
.shop:last-child{border-bottom:0}
.shop .no{width:26px;height:26px;flex:none;border-radius:8px;background:var(--blue-soft);color:var(--blue);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.shop .info{flex:1;min-width:0}
.shop .nm{font-size:14px;font-weight:600}
.shop .mt{font-size:11.5px;color:var(--ink3);margin-top:2px}
.shop .num{text-align:right}
.shop .pf{font-size:15px;font-weight:700}
.shop .pf.neg{color:var(--red)}
.shop .od{font-size:11.5px;color:var(--ink3);margin-top:2px}
.shop.empty .no{background:#f0f1f5;color:var(--ink3)}
.shop.empty .nm{color:var(--ink3);font-weight:400}
.badge{font-size:10.5px;padding:2px 7px;border-radius:999px;background:#eaf7f1;color:var(--green);margin-left:6px}
details.tbl{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px}
details.tbl summary{cursor:pointer;padding:12px 16px;font-size:13.5px;font-weight:700;color:var(--ink2)}
.tscroll{overflow-x:auto;padding:0 8px 10px}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid #f0f2f8;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--ink3);font-weight:600;font-size:11.5px}
tr.total td{font-weight:700;background:var(--blue-soft)}
tr.profit td{font-weight:700;color:var(--blue)}
.foot{font-size:11.5px;color:var(--ink3);text-align:center;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="dot"></span>利润看板 · 只读</h1>
  <div class="sub" id="genLine">数据加密传输 · 输入口令查看</div>

  <div class="lock" id="lockBox">
    <p>请输入查看口令</p>
    <input type="password" id="pwInput" placeholder="查看口令" autocomplete="off">
    <button id="btnUnlock">查看数据</button>
    <div class="err" id="pwErr"></div>
  </div>

  <div id="app" hidden>
    <div class="bar">
      <div class="tabs" id="typeTabs">
        <button data-type="week" class="on">周结</button>
        <button data-type="month">月结</button>
      </div>
      <select id="periodSelect"></select>
      <div class="cur" id="curSwitch">
        <button data-cur="CNY" class="on">¥</button>
        <button data-cur="ZAR">R</button>
      </div>
    </div>
    <div class="state" id="stateLine"></div>
    <div class="cards" id="cards"></div>
    <div class="shops" id="shopList"></div>
    <details class="tbl"><summary>展开完整报表</summary><div class="tscroll" id="tblBox"></div></details>
  </div>

  <div class="foot" id="foot"></div>
</div>

    { k: '支付手续费', t: '− 支付手续费' },
    { k: '广告费', t: '− 店铺广告费' },
    { k: '其他费用', t: '− 其他费用' },
    { k: '税金', t: '− 税金' },
    { g: '结果' },
    { k: '净利润', t: '毛利润', profit: true },
    { k: '净利率', t: '毛利率', pct: true },
    { k: '订单数', t: '订单数', int: true },
    { k: 'aov', t: '平均客单价' },
    { k: '异常行数', t: '待补数据行', int: true }
  ];

  function netSalesOf(m) {
    return (m.销售额 || 0) - (m.退款 || 0) - (m.平台佣金 || 0) -
      (m.其他平台费 || 0) - (m.物流费 || 0);
  }
  function valueOf(m, row) {
    if (row.k === 'netSales') return netSalesOf(m);
    if (row.k === 'aov') return m.订单数 ? (m.销售额 || 0) / m.订单数 : 0;
    if (row.pct) { var ns = netSalesOf(m); return ns ? (m.净利润 || 0) / ns : 0; }
    return m[row.k] || 0;
  }
  function emptyMetrics() {
    var m = {};
    SUM_FIELDS.forEach(function (k) { m[k] = 0; });
    return m;
  }
  function normalizeMetrics(raw) {
    var m = emptyMetrics(), src = raw || {};
    SUM_FIELDS.forEach(function (k) {
      var v = Number(src[k]);
      if (isFinite(v)) m[k] = v;
    });
    return m;
  }
  function sumMetrics(list) {
    var t = emptyMetrics();
    (list || []).forEach(function (m) {
      if (!m) return;
      SUM_FIELDS.forEach(function (k) { t[k] += Number(m[k]) || 0; });
    });
    return t;
  }

  /* ---------- 日期与周期 ---------- */
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function iso(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function day(y, m, d) { return new Date(y, m, d); }
  function addDays(d, n) { return day(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function today(now) {
    var d = now ? new Date(now.getTime ? now.getTime() : now) : new Date();
    return day(d.getFullYear(), d.getMonth(), d.getDate());
  }
  function parseISO(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ''));
    return m ? day(+m[1], +m[2] - 1, +m[3]) : null;
  }
  function weekFromEnd(end) {
    var start = addDays(end, -6);
    return {
      type: 'week', key: 'W:' + iso(end), start: iso(start), end: iso(end),
      label: iso(start) + ' ~ ' + iso(end)
    };
  }
  /* 周结：每周五统计「上周六 ~ 本周五」。任意日期归属包含它的那个周六~周五区间。 */
  function weekPeriod(now) {
    var d = today(now), offset = (d.getDay() + 1) % 7;
    return weekFromEnd(addDays(addDays(d, -offset), 6));
  }
  /* 月结：自然月。offset=1 表示上一个月。 */
  function monthPeriod(now, offset) {
    var d = today(now), y = d.getFullYear(), m = d.getMonth() - (offset || 0);
    var first = day(y, m, 1), last = day(y, m + 1, 0);
    return {
      type: 'month', key: 'M:' + iso(first).slice(0, 7),
      start: iso(first), end: iso(last), label: iso(first).slice(0, 7)
    };
  }
  /* 可选周期一律是「已结束」的周期：周结要等周期结束日（周五）过了才能上传/结存，
     月结要等自然月走完。运营按惯例周一上传上周六 ~ 上周五的数据。 */
  function closedWeekBase(now) {
    var cur = weekPeriod(now);
    return weekFromEnd(addDays(parseISO(cur.end), -7));
  }
  function periodList(type, now, count) {
    var out = [], n = count || 8, i;
    if (type === 'week') {
      var base = closedWeekBase(now);
      for (i = 0; i < n; i++) out.push(weekFromEnd(addDays(parseISO(base.end), -7 * i)));
    } else {
      for (i = 1; i <= n; i++) out.push(monthPeriod(now, i));
    }
    return out;
  }
  /* 默认待处理周期：最近的已结束周期（周=上周六~上周五；月=上月）。 */
  function duePeriod(type, now) {
    return type === 'week' ? closedWeekBase(now) : monthPeriod(now, 1);
  }
  function dueLabel(type, now) {
    var d = today(now);
    if (type === 'week') {
      var cur = weekPeriod(now);
      return '本周进行中，待结存 ' + cur.start.slice(5) + ' ~ ' + cur.end.slice(5) +
        '（' + (d.getDay() === 5 ? '本周五' : '周五') + '结束后可上传）';
    }
    return '本月进行中，待结存 ' + monthPeriod(now, 1).label;
  }
  function periodByKey(key, now, count) {
    var list = periodList(key && key.charAt(0) === 'M' ? 'month' : 'week', now, count || 24);
    for (var i = 0; i < list.length; i++) if (list[i].key === key) return list[i];
    return null;
  }

  /* ---------- 店铺基础信息 ---------- */
  var SHOP_COUNT = 11;
  function defaultShops(n) {
    var out = [], i;
    for (i = 1; i <= (n || SHOP_COUNT); i++)
      out.push({ no: i, name: i + '店', owner: '', skuPrefix: '', skuSuffix: '' });
    return out;
  }
  function normalizeShops(raw) {
    var base = defaultShops(), src = Array.isArray(raw) ? raw : [];
    return base.map(function (b) {
      var hit = null;
      src.forEach(function (s) { if (Number(s && s.no) === b.no) hit = s; });
      return {
        no: b.no,
        name: String(hit && hit.name || b.name).trim() || b.name,
        owner: String(hit && hit.owner || '').trim(),
        // 每家店自己的 SKU 前缀 / 后缀（防平台关联，各店规则不同）；
        // 都为空时该店回退用设置里的全局兜底前缀 / 后缀
        skuPrefix: String(hit && hit.skuPrefix || '').trim(),
        skuSuffix: String(hit && hit.skuSuffix || '').trim()
      };
    });
  }
  /* 运营提交的店铺名归位到 1~11 号：先精确匹配店名，再按名称中的数字推断。 */
  function shopNoFromName(name, shops) {
    var s = String(name || '').trim(), i;
    for (i = 0; i < (shops || []).length; i++) {
      if (String(shops[i].name || '').trim() === s) return Number(shops[i].no) || 0;
    }
    var m = /(\d{1,2})/.exec(s);
    if (m) { var no = Number(m[1]); if (no >= 1 && no <= 99) return no; }
    return 0;
  }
  function shopNameOf(no, shops) {
    var n = Number(no), i;
    for (i = 0; i < (shops || []).length; i++) if (Number(shops[i].no) === n) return shops[i].name;
    return n ? n + '店' : '';
  }
  function ownerOf(no, shops) {
    var n = Number(no), i;
    for (i = 0; i < (shops || []).length; i++) if (Number(shops[i].no) === n) return shops[i].owner || '';
    return '';
  }

  /* ---------- 提交记录 ---------- */
  function submissionId(s) {
    return String(s.shopNo || 0) + '|' + String(s.periodKey || '') + '|' + String(s.shopName || '');
  }
  function normalizeSubmission(raw) {
    if (!raw || !raw.metrics) return null;
    var shopName = String(raw.shopName || '').trim();
    var periodKey = String(raw.periodKey || '').trim();
    if (!shopName || !periodKey) return null;
    var p = periodByKey(periodKey, raw.periodStart, 240) || {};
    var end = String(raw.periodEnd || p.end || '');
    /* monthKey 直接从 key 推导：M 键即月份；W 键本身含结束日，不依赖周期列表 */
    var monthKey = periodKey.charAt(0) === 'M'
      ? periodKey
      : 'M:' + String(end || periodKey.slice(2)).slice(0, 7);
    return {
      id: submissionId(raw),
      shopName: shopName,
      shopNo: Number(raw.shopNo) || 0,
      owner: String(raw.owner || ''),
      periodKey: periodKey,
      monthKey: monthKey,
      periodType: p.type || (periodKey.charAt(0) === 'M' ? 'month' : 'week'),
      periodStart: String(raw.periodStart || p.start || ''),
      periodEnd: String(raw.periodEnd || p.end || ''),
      periodLabel: String(raw.periodLabel || p.label || periodKey),
      fx: Number(raw.fx) || 0,
      fxDate: String(raw.fxDate || ''),
      fxSource: String(raw.fxSource || ''),
      display: raw.display === 'ZAR' ? 'ZAR' : 'CNY',
      metrics: normalizeMetrics(raw.metrics),
      billFile: String(raw.billFile || ''),
      submittedAt: String(raw.submittedAt || new Date().toISOString())
    };
  }

  function fmt(n, d) {
    if (d === undefined) d = 2;
    if (typeof n !== 'number' || !isFinite(n)) return '—';
    return n.toLocaleString('zh-CN', { minimumFractionDigits: d, maximumFractionDigits: d });
  }

  return {
    MONEY_FIELDS: MONEY_FIELDS, COUNT_FIELDS: COUNT_FIELDS, SUM_FIELDS: SUM_FIELDS,
    ROWS: ROWS, SHOP_COUNT: SHOP_COUNT,
    netSalesOf: netSalesOf, valueOf: valueOf,
    emptyMetrics: emptyMetrics, normalizeMetrics: normalizeMetrics, sumMetrics: sumMetrics,
    pad2: pad2, iso: iso, day: day, addDays: addDays, today: today, parseISO: parseISO,
    weekPeriod: weekPeriod, monthPeriod: monthPeriod, periodList: periodList,
    duePeriod: duePeriod, dueLabel: dueLabel, periodByKey: periodByKey,
    defaultShops: defaultShops, normalizeShops: normalizeShops,
    shopNoFromName: shopNoFromName, shopNameOf: shopNameOf, ownerOf: ownerOf,
    submissionId: submissionId, normalizeSubmission: normalizeSubmission,
    fmt: fmt
  };
});

</script>
<script>
(function () {
  'use strict';
  var S = window.ProfitSchema;
  var DATA = null, state = { type: 'week', periodKey: '', display: 'CNY' };
  var $ = function (s) { return document.querySelector(s); };

  /* ---------- 解密（WebCrypto，与发布端参数一致） ---------- */
  var b64 = {
    dec: function (s) {
      var bin = atob(s), u8 = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      return u8;
    }
  };
  function decrypt(password) {
    var parts = document.getElementById('payload').textContent.trim().split('.');
    if (parts.length !== 3) return Promise.reject(new Error('bad'));
    return crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits'])
      .then(function (km) {
        return crypto.subtle.deriveBits(
          { name: 'PBKDF2', salt: b64.dec(parts[0]), iterations: 120000, hash: 'SHA-256' },
          km, 256);
      })
      .then(function (bits) {
        return crypto.subtle.importKey('raw', bits, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      })
      .then(function (k) {
        var ct = b64.dec(parts[2]);
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64.dec(parts[1]) }, k, ct);
      })
      .then(function (buf) {
        return JSON.parse(new TextDecoder().decode(buf));
      });
  }

  /* ---------- 数据视图（口径与管理台一致） ---------- */
  function monthKeyOf(sub) {
    return sub.monthKey || 'M:' + String(sub.periodEnd || '').slice(0, 7);
  }
  function isMonthSub(sub) {
    return sub.periodType === 'month' || /^M:/.test(String(sub.periodKey || ''));
  }
  function subsFor(p) {
    return (DATA.submissions || []).filter(function (s) {
      return p.type === 'month' ? monthKeyOf(s) === p.key : s.periodKey === p.key;
    });
  }
  function fxNow() {
    var fx = 0;
    (DATA.submissions || []).forEach(function (s) { if (Number(s.fx) > 0) fx = Number(s.fx); });
    return fx || 0.41;
  }
  function fxFactor() { return state.display === 'ZAR' ? 1 / fxNow() : 1; }
  function fmt(n, d) {
    d = d === undefined ? 2 : d;
    if (typeof n !== 'number' || !isFinite(n)) return '—';
    return n.toLocaleString('zh-CN', { minimumFractionDigits: d, maximumFractionDigits: d });
  }
  function buildMatrix() {
    var p = S.periodByKey(state.periodKey, new Date(), 24) || S.duePeriod(state.type, new Date());
    var list = subsFor(p), byNo = {};
    var monthDirect = {};
    if (p.type === 'month') {
      list.forEach(function (sub) {
        if (!isMonthSub(sub)) return;
        var n = Number(sub.shopNo) || S.shopNoFromName(sub.shopName, DATA.shops);
        if (n) monthDirect[n] = true;
      });
    }
    list.forEach(function (sub) {
      var no = Number(sub.shopNo) || S.shopNoFromName(sub.shopName, DATA.shops);
      if (!no) return;
      if (p.type === 'month' && monthDirect[no] && !isMonthSub(sub)) return;
      if (!byNo[no]) byNo[no] = { metrics: S.emptyMetrics(), submittedAt: '', name: sub.shopName };
      var b = byNo[no];
      b.metrics = p.type === 'month'
        ? S.sumMetrics([b.metrics, S.normalizeMetrics(sub.metrics)])
        : S.normalizeMetrics(sub.metrics);
      if (String(sub.submittedAt) > b.submittedAt) b.submittedAt = sub.submittedAt;
    });
    var settled = null;
    (DATA.settlements || []).forEach(function (st) { if (st.periodKey === p.key) settled = st; });
    return { period: p, byNo: byNo, settled: settled };
  }

  /* ---------- 渲染 ---------- */
  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function renderBar() {
    var list = S.periodList(state.type, new Date(), 12);
    if (!state.periodKey) state.periodKey = S.duePeriod(state.type, new Date()).key;
    if (!list.some(function (p) { return p.key === state.periodKey; })) {
      state.periodKey = list[0] ? list[0].key : state.periodKey;
    }
    $('#periodSelect').innerHTML = list.map(function (p) {
      var n = subsFor(p).length;
      return '<option value="' + esc(p.key) + '">' + esc(p.label) + (n ? ' · ' + n + ' 家' : '') + '</option>';
    }).join('');
    $('#periodSelect').value = state.periodKey;
    document.querySelectorAll('#typeTabs button').forEach(function (b) {
      b.classList.toggle('on', b.dataset.type === state.type);
    });
    document.querySelectorAll('#curSwitch button').forEach(function (b) {
      b.classList.toggle('on', b.dataset.cur === state.display);
    });
  }
  function render() {
    var mx = buildMatrix(), f = fxFactor();
    var shops = DATA.shops && DATA.shops.length ? DATA.shops : S.defaultShops();
    var uploaded = 0, total = S.emptyMetrics();
    shops.forEach(function (sh) {
      var d = mx.byNo[sh.no];
      if (d) { uploaded++; total = S.sumMetrics([total, d.metrics]); }
    });
    var ns = S.netSalesOf(total);
    var sym = state.display === 'ZAR' ? 'R' : '¥';
    $('#stateLine').innerHTML = esc(mx.period.label) +
      (mx.settled ? ' <span class="ok">已结存 ' + esc(String(mx.settled.settledAt).slice(0, 10)) + '</span>'
        : ' <span>未结存</span>') +
      ' · 已上传 ' + uploaded + ' / ' + shops.length + ' 家 · 汇率 1R=' + fxNow().toFixed(4) + '¥';
    $('#cards').innerHTML =
      '<div class="card"><div class="k">销售额（' + sym + '）</div><div class="v">' + fmt(total.销售额 * f) + '</div></div>' +
      '<div class="card"><div class="k">净销售额（' + sym + '）</div><div class="v">' + fmt(ns * f) + '</div></div>' +
      '<div class="card hl"><div class="k">毛利润（' + sym + '）</div><div class="v">' + fmt(total.净利润 * f) + '</div></div>' +
      '<div class="card"><div class="k">订单数</div><div class="v">' + Math.round(total.订单数) + '<small> 单</small></div></div>';
    var h = '<div class="hd">各店铺 · ' + esc(mx.period.label) + '</div>';
    shops.forEach(function (sh) {
      var d = mx.byNo[sh.no];
      if (d) {
        h += '<div class="shop"><span class="no">' + sh.no + '</span>' +
          '<div class="info"><div class="nm">' + esc(sh.name) + '<span class="badge">已上传</span></div>' +
          '<div class="mt">' + esc(sh.owner || '') + (d.submittedAt ? ' · 提交于 ' + esc(String(d.submittedAt).slice(5, 10)) : '') + '</div></div>' +
          '<div class="num"><div class="pf' + (d.metrics.净利润 < 0 ? ' neg' : '') + '">' + fmt(d.metrics.净利润 * f) + '</div>' +
          '<div class="od">' + Math.round(d.metrics.订单数) + ' 单</div></div></div>';
      } else {
        h += '<div class="shop empty"><span class="no">' + sh.no + '</span>' +
          '<div class="info"><div class="nm">' + esc(sh.name) + '</div>' +
          '<div class="mt">' + esc(sh.owner || '') + '</div></div>' +
          '<div class="num"><div class="pf" style="color:var(--ink3);font-size:12px">尚未上传</div></div></div>';
      }
    });
    $('#shopList').innerHTML = h;
    // 完整报表（口径行与管理台 ROWS 一致）
    var th = '<tr><th>项目（' + sym + '）</th>';
    var cols = [];
    shops.forEach(function (sh) { if (mx.byNo[sh.no]) cols.push(sh); });
    cols.forEach(function (sh) { th += '<th>' + esc(sh.name) + '</th>'; });
    th += '<th>合计</th></tr>';
    var body = '';
    S.ROWS.forEach(function (row) {
      if (row.g) { body += '<tr><td colspan="' + (cols.length + 2) + '" style="font-weight:700;color:var(--ink3);font-size:11px">' + esc(row.g) + '</td></tr>'; return; }
      var cls = row.profit ? 'profit' : (row.total ? 'total' : '');
      body += '<tr class="' + cls + '"><td>' + esc(row.t) + '</td>';
      cols.forEach(function (sh) {
        var v = S.valueOf(mx.byNo[sh.no].metrics, row);
        body += '<td>' + (row.int ? Math.round(v) : (row.pct ? (v * 100).toFixed(2) + '%' : fmt(v * f))) + '</td>';
      });
      var tv = S.valueOf(total, row);
      body += '<td>' + (row.int ? Math.round(tv) : (row.pct ? (tv * 100).toFixed(2) + '%' : fmt(tv * f))) + '</td></tr>';
    });
    $('#tblBox').innerHTML = '<table>' + '<thead>' + th + '</thead><tbody>' + body + '</tbody></table>';
  }
  function renderFoot() {
    var t = new Date(DATA.generatedAt);
    $('#foot').innerHTML = '数据更新于 ' + t.toLocaleString('zh-CN') +
      ' · 只读镜像，每 30 分钟自动同步<br>毛利润口径：净销售额 − 店铺广告费 − 商品成本（未含海外仓 / 人工 / 摊销）';
    $('#genLine').textContent = '已解锁 · 数据加密传输';
  }

  /* ---------- 交互 ---------- */
  function unlock() {
    var pw = $('#pwInput').value;
    $('#pwErr').textContent = '';
    decrypt(pw).then(function (d) {
      DATA = d;
      localStorage.setItem('ps-view-pw', pw);
      $('#lockBox').hidden = true;
      $('#app').hidden = false;
      renderFoot(); renderBar(); render();
    }).catch(function () {
      $('#pwErr').textContent = '口令不对，解不开';
    });
  }
  $('#btnUnlock').addEventListener('click', unlock);
  $('#pwInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') unlock(); });
  $('#typeTabs').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-type]'); if (!b) return;
    state.type = b.dataset.type;
    state.periodKey = S.duePeriod(state.type, new Date()).key;
    renderBar(); render();
  });
  $('#periodSelect').addEventListener('change', function () {
    state.periodKey = $('#periodSelect').value; render();
  });
  $('#curSwitch').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-cur]'); if (!b) return;
    state.display = b.dataset.cur;
    renderBar(); render();
  });
  // 记住口令（本机浏览器），下次直接进
  try {
    var saved = localStorage.getItem('ps-view-pw');
    if (saved) { $('#pwInput').value = saved; decrypt(saved).then(function (d) {
      DATA = d; $('#lockBox').hidden = true; $('#app').hidden = false;
      renderFoot(); renderBar(); render();
    }).catch(function () { localStorage.removeItem('ps-view-pw'); }); }
  } catch (e) { }
})();
</script>
</body>
